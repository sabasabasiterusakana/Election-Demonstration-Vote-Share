<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0"
    />
    <title>お問い合わせ — 模擬投票</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" type="text/css" href="../common.css" />
    <link rel="stylesheet" type="text/css" href="style.css" />
  </head>
  <body>
    <div class="app-header">
      <div class="hdr-row">
        <div class="hdr-logo">
          <div class="logo-box">✉️</div>
          <div class="logo-text">お問い<span>合わせ</span></div>
        </div>
      </div>
      <div class="hdr-sub">ご意見・不具合報告を送信できます</div>
    </div>

    <div class="contact-wrap">
      <div class="contact-card">
        <div class="sec-label">フォーム</div>
        <div class="form-group" style="margin-top: 10px">
          <label class="f-label">お名前（任意）</label>
          <input type="text" id="inqName" placeholder="例: 田中 太郎" />
        </div>
        <div class="form-group">
          <label class="f-label">メールアドレス（任意）</label>
          <input type="text" id="inqEmail" placeholder="例: sample@example.com" />
        </div>
        <div class="form-group">
          <label class="f-label">種別</label>
          <select id="inqType">
            <option value="bug">不具合報告</option>
            <option value="feature">機能要望</option>
            <option value="question">質問</option>
            <option value="other">その他</option>
          </select>
        </div>
        <div class="form-group">
          <label class="f-label">内容 *</label>
          <textarea
            id="inqMessage"
            placeholder="お問い合わせ内容をご記入ください"
          ></textarea>
        </div>
        <button class="btn btn-primary btn-full" id="inqSubmitBtn" onclick="submitInquiry()">
          送信する
        </button>
        <div class="contact-note">
          ※ 送信内容は管理者が確認します。返信先未入力の場合、個別返信はできません。
        </div>
      </div>
    </div>

    <div class="toast" id="toast"></div>

    <div class="bottom-nav">
      <a href="../index/index.html" class="nav-btn"
        ><span class="nav-icon">🗳️</span>投票</a
      >
      <a href="../resource/resource.html" class="nav-btn"
        ><span class="nav-icon">📊</span>結果</a
      >
      <a href="../ai-analysis/analysis.html" class="nav-btn"
        ><span class="nav-icon">🤖</span>AI分析</a
      >
      <a href="../matching/matching.html" class="nav-btn"
        ><span class="nav-icon">🎯</span>マッチング</a
      >
      <a href="contact.html" class="nav-btn active"
        ><span class="nav-icon">✉️</span>問合せ</a
      >
      <a href="../admin/admin.html" class="nav-btn"
        ><span class="nav-icon">⚙️</span>管理</a
      >
    </div>

    <script type="module" src="main.js"></script>
  </body>
</html>
