<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1.0,maximum-scale=1.0"
    />
    <title>AI分析 — 模擬投票</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../common.css" />
    <link rel="stylesheet" href="style.css" />
<style>
.notice-banner{display:flex;align-items:flex-start;gap:10px;margin:10px 14px 0;padding:11px 13px;border-radius:10px;font-size:12px;line-height:1.65;}
.notice-banner.yellow{background:#fffbeb;border:1.5px solid #fcd34d;color:#92400e;}
.notice-banner.blue{background:#eff6ff;border:1.5px solid #bfdbfe;color:#1e40af;}
.notice-icon{font-size:16px;flex-shrink:0;margin-top:1px;}
</style>
  </head>
  <body>
    <div class="app-header">
      <div class="hdr-row">
        <div class="hdr-logo">
          <div class="logo-box">🤖</div>
          <div class="logo-text">AI<span>分析</span></div>
        </div>
      </div>
      <div class="hdr-sub">候補者ごとのAI分析を閲覧できます</div>
    </div>

    <div style="padding: 14px">
      <div class="notice-banner blue">
        <span class="notice-icon">ℹ️</span>
        <span>AI分析の内容は各候補者のPR動画での発言内容をもとに平等に作成されています。AIによる自動生成を含むため、参考情報としてご活用ください。</span>
      </div>
      <div class="sec-label">候補者一覧</div>
      <div id="aiCandList" style="margin-top: 8px"></div>
    </div>

    <!-- AI Analysis Modal -->
    <div class="sheet-overlay" id="aiModal" onclick="closeAiModal(event)">
      <div class="sheet">
        <div class="sheet-handle"></div>
        <div class="sheet-body">
          <div id="aiDetail" style="color: var(--text)"></div>
          <button
            class="btn btn-secondary btn-full"
            style="margin-top: 16px"
            onclick="closeAiModal()"
          >
            閉じる
          </button>
        </div>
      </div>
    </div>

    <div class="bottom-nav">
      <a href="../index/index.html" class="nav-btn"
        ><span class="nav-icon">🗳️</span>投票</a
      >
      <a href="../resource/resource.html" class="nav-btn"
        ><span class="nav-icon">📊</span>結果</a
      >
      <a href="analysis.html" class="nav-btn"
        ><span class="nav-icon">🤖</span>AI分析</a
      >
      <a href="../admin/admin.html" class="nav-btn"
        ><span class="nav-icon">⚙️</span>管理</a
      >
    </div>

    <script type="module" src="main.js"></script>
  </body>
</html>
